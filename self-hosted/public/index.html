<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="referrer" content="no-referrer">
  <title>ToolArks · Remote Login Relay</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#101114;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{display:grid;grid-template-rows:auto 1fr auto}header,footer{display:flex;align-items:center;gap:8px;padding:8px max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left));background:#1d2026;z-index:2}header{padding-top:max(8px,env(safe-area-inset-top))}footer{padding-bottom:max(8px,env(safe-area-inset-bottom))}input,button{min-height:44px;border:1px solid #454b57;border-radius:9px;background:#292d35;color:#fff;font-size:16px}button{padding:0 14px;font-weight:700}input{flex:1;min-width:0;padding:0 11px}#tab{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}#viewport{position:relative;min-width:0;min-height:0;overflow:hidden}canvas{position:absolute;left:50%;top:50%;display:block;background:#fff;transform:translate(-50%,-50%);touch-action:none;user-select:none;-webkit-user-select:none}#status{position:absolute;top:12px;left:50%;width:max-content;max-width:calc(100% - 24px);transform:translateX(-50%);padding:10px 14px;border-radius:12px;background:rgba(0,0,0,.82);font-size:15px;line-height:1.45;text-align:center;pointer-events:none}#status.ready{opacity:0;transition:opacity .5s 1s}.compact{width:46px;padding:0}
  </style>
</head>
<body>
  <header><strong id="tab">Chrome page waiting for login</strong><button id="back" class="compact" aria-label="Back">‹</button><button id="reload" class="compact" aria-label="Reload">↻</button></header>
  <main id="viewport"><canvas id="screen"></canvas><div id="status">Connecting to your Chrome tab…</div></main>
  <footer><input id="text" autocomplete="off" autocapitalize="off" placeholder="Tap a field above, then type here"><button id="send">Send</button><button id="backspace" class="compact" aria-label="Backspace">⌫</button><button id="enter" class="compact" aria-label="Enter">↵</button></footer>
  <script>
    const token=new URLSearchParams(location.hash.slice(1)).get('token')||'';const canvas=document.querySelector('#screen'),ctx=canvas.getContext('2d'),status=document.querySelector('#status');let metadata={deviceWidth:1,deviceHeight:1},ws,touchStart=null,lastTouch=null,frameSequence=0,renderedFrame=0;
    const setStatus=(text,ready=false)=>{status.textContent=text;status.classList.toggle('ready',ready)};
    function fit(){const v=document.querySelector('#viewport').getBoundingClientRect();if(!canvas.width||!canvas.height||!v.width||!v.height)return;const s=Math.min(v.width/canvas.width,v.height/canvas.height);canvas.style.width=`${Math.max(1,canvas.width*s)}px`;canvas.style.height=`${Math.max(1,canvas.height*s)}px`}
    const send=(m)=>{if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify(m))};
    function point(e){const r=canvas.getBoundingClientRect(),p=metadata.pageScaleFactor||1,w=metadata.deviceWidth/p,h=metadata.deviceHeight/p;return{x:Math.max(0,Math.min(w,(e.clientX-r.left)*w/r.width)),y:Math.max(0,Math.min(h,(e.clientY-r.top)*h/r.height))}}
    async function connect(){if(!token)throw new Error('This temporary link is missing its access token.');const t=await fetch('/api/tab',{headers:{authorization:`Bearer ${token}`}});if(!t.ok)throw new Error('This temporary session has ended.');const d=await t.json();document.querySelector('#tab').textContent=d.tab.title||d.tab.url;const scheme=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(`${scheme}://${location.host}/ws?token=${encodeURIComponent(token)}`);ws.onmessage=(event)=>{const m=JSON.parse(event.data);if(m.type==='frame'){metadata=m.metadata;const id=++frameSequence,image=new Image();image.onload=()=>{if(id<renderedFrame)return;renderedFrame=id;const changed=canvas.width!==image.naturalWidth||canvas.height!==image.naturalHeight;if(changed){canvas.width=image.naturalWidth;canvas.height=image.naturalHeight}ctx.drawImage(image,0,0);if(changed||!canvas.style.width)fit();setStatus('Connected',true)};image.src=`data:image/jpeg;base64,${m.data}`}else if(m.type==='error')setStatus(m.message)};ws.onclose=()=>setStatus('The temporary session is closed. Your Chrome login remains on the Mac.')}
    canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);const p=point(e);if(e.pointerType==='touch'){touchStart={...p,clientX:e.clientX,clientY:e.clientY};lastTouch={clientX:e.clientX,clientY:e.clientY}}else send({type:'pointer',phase:'down',...p})});
    canvas.addEventListener('pointermove',e=>{e.preventDefault();const p=point(e);if(e.pointerType==='touch'&&lastTouch){const dx=lastTouch.clientX-e.clientX,dy=lastTouch.clientY-e.clientY,scale=metadata.pageScaleFactor||1;if(Math.abs(dx)+Math.abs(dy)>2)send({type:'wheel',...p,deltaX:dx*3/scale,deltaY:dy*3/scale});lastTouch={clientX:e.clientX,clientY:e.clientY}}else if(e.buttons)send({type:'pointer',phase:'move',dragging:true,...p})});
    canvas.addEventListener('pointerup',e=>{e.preventDefault();const p=point(e);if(e.pointerType==='touch'&&touchStart){if(Math.hypot(e.clientX-touchStart.clientX,e.clientY-touchStart.clientY)<12){send({type:'pointer',phase:'down',...p});setTimeout(()=>send({type:'pointer',phase:'up',...p}),45)}}else send({type:'pointer',phase:'up',...p});touchStart=null;lastTouch=null});
    document.querySelector('#reload').onclick=()=>send({type:'reload'});document.querySelector('#back').onclick=()=>send({type:'back'});document.querySelector('#send').onclick=()=>{const i=document.querySelector('#text');if(i.value)send({type:'text',text:i.value});i.value=''};document.querySelector('#text').addEventListener('keydown',e=>{if(e.key==='Enter')document.querySelector('#send').click()});document.querySelector('#backspace').onclick=()=>send({type:'key',key:'Backspace'});document.querySelector('#enter').onclick=()=>send({type:'key',key:'Enter'});window.addEventListener('resize',fit);window.addEventListener('orientationchange',()=>setTimeout(fit,100));connect().catch(e=>setStatus(e.message));
  </script>
</body>
</html>
